<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星绥小手机模拟器</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
      color: white;
    }

    .header h1 {
      font-size: 28px;
      margin-bottom: 8px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
    }

    .header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .controls {
      background: rgba(255,255,255,0.95);
      border-radius: 16px;
      padding: 16px 20px;
      margin-bottom: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: center;
      max-width: 900px;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .control-group label {
      font-size: 13px;
      color: #555;
      font-weight: 500;
    }

    .control-group input,
    .control-group select {
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    .control-group input:focus,
    .control-group select:focus {
      border-color: #667eea;
    }

    .control-group input[type="url"] {
      width: 320px;
    }

    .btn {
      padding: 8px 18px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(102,126,234,0.4);
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #555;
    }

    .btn-secondary:hover {
      background: #e5e5e5;
    }

    .phone-container {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 40px;
      flex-wrap: wrap;
    }

    .phone-wrapper {
      position: relative;
    }

    /* iPhone 外框 */
    .phone-frame {
      position: relative;
      background: #1a1a1a;
      border-radius: 50px;
      padding: 12px;
      box-shadow: 
        0 0 0 2px #2a2a2a,
        0 25px 50px rgba(0,0,0,0.4),
        inset 0 0 0 1px rgba(255,255,255,0.1);
    }

    .phone-screen {
      position: relative;
      background: #000;
      border-radius: 40px;
      overflow: hidden;
    }

    /* 刘海 */
    .phone-notch {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 28px;
      background: #000;
      border-radius: 0 0 18px 18px;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .phone-notch::before {
      content: '';
      width: 8px;
      height: 8px;
      background: #1a1a1a;
      border-radius: 50%;
    }

    .phone-notch::after {
      content: '';
      width: 12px;
      height: 12px;
      background: #1a1a1a;
      border-radius: 50%;
    }

    /* 状态栏 */
    .phone-status-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 44px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      z-index: 99;
      color: white;
      font-size: 14px;
      font-weight: 600;
      pointer-events: none;
    }

    .phone-status-bar .time {
      font-variant-numeric: tabular-nums;
    }

    .phone-status-bar .icons {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .phone-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* 底部 Home Indicator */
    .phone-home-indicator {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 134px;
      height: 5px;
      background: rgba(255,255,255,0.5);
      border-radius: 3px;
      z-index: 100;
    }

    /* 侧边按钮 */
    .phone-side-btn {
      position: absolute;
      background: #2a2a2a;
      border-radius: 2px;
    }

    .phone-side-btn.silent {
      left: -3px;
      top: 120px;
      width: 3px;
      height: 30px;
    }

    .phone-side-btn.vol-up {
      left: -3px;
      top: 170px;
      width: 3px;
      height: 55px;
    }

    .phone-side-btn.vol-down {
      left: -3px;
      top: 235px;
      width: 3px;
      height: 55px;
    }

    .phone-side-btn.power {
      right: -3px;
      top: 180px;
      width: 3px;
      height: 80px;
    }

    /* 信息面板 */
    .info-panel {
      background: rgba(255,255,255,0.95);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
      width: 280px;
    }

    .info-panel h3 {
      font-size: 16px;
      color: #333;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #eee;
    }

    .info-item {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 13px;
    }

    .info-item .label {
      color: #888;
    }

    .info-item .value {
      color: #333;
      font-weight: 500;
    }

    .tips {
      margin-top: 16px;
      padding: 12px;
      background: #f8f9ff;
      border-radius: 8px;
      font-size: 12px;
      color: #666;
      line-height: 1.6;
    }

    .tips strong {
      color: #667eea;
    }

    /* 横屏模式 */
    .phone-wrapper.landscape .phone-frame {
      transform: rotate(90deg);
      transform-origin: center center;
    }

    .footer {
      margin-top: 30px;
      color: rgba(255,255,255,0.7);
      font-size: 12px;
      text-align: center;
    }

    /* 加载动画 */
    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      color: white;
      gap: 16px;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-size: 14px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>✨ 星绥小手机模拟器</h1>
    <p>在电脑上预览你的小手机应用，不用每次都部署到手机上测试啦～</p>
  </div>

  <div class="controls">
    <div class="control-group">
      <label>应用网址：</label>
      <input type="url" id="appUrl" placeholder="https://你的应用地址.github.io/stellasei/" value="">
    </div>
    <div class="control-group">
      <label>手机型号：</label>
      <select id="phoneModel">
        <option value="iphone-se">iPhone SE (375×667)</option>
        <option value="iphone-12" selected>iPhone 12/13/14 (390×844)</option>
        <option value="iphone-14-pro">iPhone 14 Pro/15 (393×852)</option>
        <option value="iphone-14-pro-max">iPhone 14 Pro Max (430×932)</option>
        <option value="iphone-15-pro-max">iPhone 15 Pro Max (430×932)</option>
      </select>
    </div>
    <div class="control-group">
      <label>缩放：</label>
      <select id="zoomLevel">
        <option value="0.5">50%</option>
        <option value="0.6">60%</option>
        <option value="0.7" selected>70%</option>
        <option value="0.8">80%</option>
        <option value="0.9">90%</option>
        <option value="1">100%</option>
      </select>
    </div>
    <button class="btn btn-primary" onclick="loadApp()">加载应用</button>
    <button class="btn btn-secondary" onclick="toggleOrientation()">切换横竖屏</button>
    <button class="btn btn-secondary" onclick="refreshFrame()">刷新</button>
  </div>

  <div class="phone-container">
    <div class="phone-wrapper" id="phoneWrapper">
      <div class="phone-frame" id="phoneFrame">
        <!-- 侧边按钮 -->
        <div class="phone-side-btn silent"></div>
        <div class="phone-side-btn vol-up"></div>
        <div class="phone-side-btn vol-down"></div>
        <div class="phone-side-btn power"></div>

        <div class="phone-screen" id="phoneScreen">
          <!-- 刘海 -->
          <div class="phone-notch"></div>
          
          <!-- 状态栏 -->
          <div class="phone-status-bar">
            <span class="time" id="statusTime">9:41</span>
            <div class="icons">
              <span>📶</span>
              <span>🔋</span>
            </div>
          </div>

          <!-- 加载动画 -->
          <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-spinner"></div>
            <div class="loading-text">正在加载应用...</div>
          </div>

          <!-- iframe -->
          <iframe 
            id="appFrame" 
            class="phone-iframe" 
            src="about:blank"
            allow="clipboard-read; clipboard-write; fullscreen; microphone; camera; geolocation"
            onload="hideLoading()">
          </iframe>

          <!-- Home Indicator -->
          <div class="phone-home-indicator"></div>
        </div>
      </div>
    </div>

    <div class="info-panel">
      <h3>📱 设备信息</h3>
      <div class="info-item">
        <span class="label">型号：</span>
        <span class="value" id="infoModel">iPhone 12</span>
      </div>
      <div class="info-item">
        <span class="label">分辨率：</span>
        <span class="value" id="infoResolution">390 × 844</span>
      </div>
      <div class="info-item">
        <span class="label">缩放：</span>
        <span class="value" id="infoZoom">70%</span>
      </div>
      <div class="info-item">
        <span class="label">方向：</span>
        <span class="value" id="infoOrientation">竖屏</span>
      </div>
      <div class="info-item">
        <span class="label">DPR：</span>
        <span class="value">3x</span>
      </div>

      <div class="tips">
        <strong>💡 使用小贴士：</strong><br>
        1. 输入你的应用网址，点击"加载应用"<br>
        2. 选择你的手机型号，模拟真实尺寸<br>
        3. 调整缩放比例，方便在电脑上查看<br>
        4. 可以切换横竖屏测试<br>
        5. 点击"刷新"重新加载应用<br>
        <br>
        <strong>⚠️ 注意：</strong><br>
        部分功能（如 PWA 添加到主屏幕、推送通知）需要在真实手机上测试，模拟器中可能无法使用。
      </div>
    </div>
  </div>

  <div class="footer">
    星绥小手机模拟器 · 为恩熙量身定制 ✨
  </div>

  <script>
    // 手机型号配置
    const phoneModels = {
      'iphone-se': { name: 'iPhone SE', width: 375, height: 667 },
      'iphone-12': { name: 'iPhone 12/13/14', width: 390, height: 844 },
      'iphone-14-pro': { name: 'iPhone 14 Pro/15', width: 393, height: 852 },
      'iphone-14-pro-max': { name: 'iPhone 14 Pro Max', width: 430, height: 932 },
      'iphone-15-pro-max': { name: 'iPhone 15 Pro Max', width: 430, height: 932 }
    };

    let isLandscape = false;

    // 更新状态栏时间
    function updateTime() {
      const now = new Date();
      const hours = now.getHours();
      const minutes = now.getMinutes().toString().padStart(2, '0');
      document.getElementById('statusTime').textContent = `${hours}:${minutes}`;
    }
    updateTime();
    setInterval(updateTime, 1000);

    // 应用手机型号配置
    function applyPhoneModel() {
      const modelKey = document.getElementById('phoneModel').value;
      const model = phoneModels[modelKey];
      const zoom = parseFloat(document.getElementById('zoomLevel').value);
      
      const screenWidth = isLandscape ? model.height : model.width;
      const screenHeight = isLandscape ? model.width : model.height;
      
      const frame = document.getElementById('phoneFrame');
      const screen = document.getElementById('phoneScreen');
      
      screen.style.width = (screenWidth * zoom) + 'px';
      screen.style.height = (screenHeight * zoom) + 'px';
      
      // 更新信息面板
      document.getElementById('infoModel').textContent = model.name;
      document.getElementById('infoResolution').textContent = `${model.width} × ${model.height}`;
      document.getElementById('infoZoom').textContent = (zoom * 100) + '%';
      document.getElementById('infoOrientation').textContent = isLandscape ? '横屏' : '竖屏';
    }

    // 加载应用
    function loadApp() {
      const url = document.getElementById('appUrl').value.trim();
      if (!url) {
        alert('请输入应用网址！');
        return;
      }
      
      showLoading();
      document.getElementById('appFrame').src = url;
      
      // 保存到 localStorage
      try {
        localStorage.setItem('phone-simulator-url', url);
      } catch (e) {}
    }

    // 显示加载动画
    function showLoading() {
      document.getElementById('loadingOverlay').style.display = 'flex';
    }

    // 隐藏加载动画
    function hideLoading() {
      setTimeout(() => {
        document.getElementById('loadingOverlay').style.display = 'none';
      }, 500);
    }

    // 刷新 iframe
    function refreshFrame() {
      showLoading();
      const frame = document.getElementById('appFrame');
      frame.src = frame.src;
    }

    // 切换横竖屏
    function toggleOrientation() {
      isLandscape = !isLandscape;
      applyPhoneModel();
    }

    // 事件监听
    document.getElementById('phoneModel').addEventListener('change', applyPhoneModel);
    document.getElementById('zoomLevel').addEventListener('change', applyPhoneModel);
    
    // 回车键加载应用
    document.getElementById('appUrl').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        loadApp();
      }
    });

    // 初始化
    window.addEventListener('load', function() {
      applyPhoneModel();
      
      // 恢复之前的网址
      try {
        const savedUrl = localStorage.getItem('phone-simulator-url');
        if (savedUrl) {
          document.getElementById('appUrl').value = savedUrl;
        }
      } catch (e) {}
    });
  </script>
</body>
</html>
